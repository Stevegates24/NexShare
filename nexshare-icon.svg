<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background gradient: deep dark purple -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0050"/>
      <stop offset="100%" stop-color="#060014"/>
    </linearGradient>
    <!-- Node fill gradient: neon purple -->
    <linearGradient id="nd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <!-- Glow filter for nodes -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle line glow -->
    <filter id="lglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>

  <!-- Inner subtle border glow -->
  <rect width="32" height="32" rx="7" ry="7"
        fill="none" stroke="#7C3AED" stroke-width="0.6" opacity="0.5"/>

  <!-- Connection lines (drawn below nodes) -->
  <!-- Glowing blur copy of lines -->
  <g filter="url(#lglow)" opacity="0.6">
    <line x1="16" y1="8"  x2="8"  y2="22" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="8"  x2="24" y2="22" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8"  y1="22" x2="24" y2="22" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Crisp lines on top -->
  <line x1="16" y1="8"  x2="8"  y2="22" stroke="#8B5CF6" stroke-width="1"   stroke-linecap="round" opacity="0.9"/>
  <line x1="16" y1="8"  x2="24" y2="22" stroke="#8B5CF6" stroke-width="1"   stroke-linecap="round" opacity="0.9"/>
  <line x1="8"  y1="22" x2="24" y2="22" stroke="#8B5CF6" stroke-width="1"   stroke-linecap="round" opacity="0.9"/>

  <!-- Nodes with glow -->
  <g filter="url(#glow)">
    <!-- Top node -->
    <circle cx="16" cy="8"  r="3.4" fill="url(#nd)"/>
    <!-- Bottom-left node -->
    <circle cx="8"  cy="22" r="3.4" fill="url(#nd)"/>
    <!-- Bottom-right node -->
    <circle cx="24" cy="22" r="3.4" fill="url(#nd)"/>
  </g>

  <!-- Bright highlight dots (inner shine on each node) -->
  <circle cx="15.1" cy="7.1" r="1"   fill="white" opacity="0.35"/>
  <circle cx="7.1"  cy="21.1" r="1"  fill="white" opacity="0.35"/>
  <circle cx="23.1" cy="21.1" r="1"  fill="white" opacity="0.35"/>
</svg>
